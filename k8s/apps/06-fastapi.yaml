apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: mlops-pf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: joshin290/mlops-pf-fastapi:69e0554ea95ac350349ab7b2fd14e041b1150e4e
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mlops-secrets
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-svc:5000"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-svc
  namespace: mlops-pf
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000
      targetPort: 8000
