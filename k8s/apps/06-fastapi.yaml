apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: mlops-pf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: joshin290/mlops-pf-fastapi:c82feb1a8b980d9219238c4a3aea298955c29d35
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mlops-secrets
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-svc:5000"
            - name: MLFLOW_HTTP_REQUEST_TIMEOUT
              value: "10"
            - name: MLFLOW_HTTP_REQUEST_MAX_RETRIES
              value: "2"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 18
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-svc
  namespace: mlops-pf
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000
      targetPort: 8000
