apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: mlops-pf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: joshin290/mlops-pf-locust:789702df2df28bafa6ee06a1b1f7bd783e92a0c5
          args: ["-f", "/mnt/locust/locustfile.py", "--host=http://fastapi-svc:8000"]
          ports:
            - containerPort: 8089
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: locust-svc
  namespace: mlops-pf
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089