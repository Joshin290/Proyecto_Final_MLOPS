apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: mlops-pf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
        - name: streamlit
          image: joshin290/mlops-pf-streamlit:789702df2df28bafa6ee06a1b1f7bd783e92a0c5
          ports:
            - containerPort: 8501
          envFrom:
            - secretRef:
                name: mlops-secrets
          env:
            - name: FASTAPI_URL
              value: "http://fastapi-svc:8000"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-svc:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio-svc:9000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-svc
  namespace: mlops-pf
spec:
  selector:
    app: streamlit
  ports:
    - port: 8501
      targetPort: 8501