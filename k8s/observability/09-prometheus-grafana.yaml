apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops-pf
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'fastapi-inference'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['fastapi-svc:8000']
      - job_name: 'data-api'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['data-api-svc:80']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mlops-pf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: mlops-pf
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: mlops-pf
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus-ds
        access: proxy
        url: http://prometheus-svc:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'mlops-dashboards'
        orgId: 1
        folder: 'MLOps'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: mlops-pf
data:
  mlops-fastapi-dashboard.json: |
    {
      "uid": "mlops-fastapi-obs",
      "title": "MLOps FastAPI & Locust Observability",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Peticiones por Segundo (RPS)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "targets": [{"expr": "sum(rate(inference_requests_total[1m])) by (status)", "legendFormat": "{{status}}"}]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latencia P95 de Inferencia (segundos)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(inference_latency_seconds_bucket[1m])) by (le))", "legendFormat": "P95"}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Versión Activa del Modelo (@champion)",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "targets": [{"expr": "max(loaded_model_version)", "legendFormat": "Version"}]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Tasa de Errores de Inferencia",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "targets": [{"expr": "rate(inference_errors_total[1m])", "legendFormat": "Errors/s"}]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Consumo RAM y CPU de FastAPI",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "targets": [
            {"expr": "process_resident_memory_bytes{job='fastapi-inference'} / 1024 / 1024", "legendFormat": "RAM (MB)"},
            {"expr": "rate(process_cpu_seconds_total{job='fastapi-inference'}[1m]) * 100", "legendFormat": "CPU (%)"}
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mlops-pf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: datasource
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource
          configMap:
            name: grafana-provisioning
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: mlops-pf
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000