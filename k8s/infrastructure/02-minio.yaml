apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: mlops-pf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: mlops-pf
spec:
  serviceName: "minio-svc"
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      initContainers:
        - name: fix-minio-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65532:65532 /data"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: minio-data
              mountPath: /data
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mlops-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-secrets
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio-svc
  namespace: mlops-pf
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: mlops-pf
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-bucket
          image: joshin290/mlops-pf-mlflow:latest
          envFrom:
            - secretRef:
                name: mlops-secrets
          command: ["python", "-c"]
          args:
            - |
              import os, time, boto3
              from botocore.exceptions import ClientError

              s3 = boto3.client(
                  "s3",
                  endpoint_url="http://minio-svc:9000",
                  aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
                  aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
                  region_name=os.environ.get("AWS_DEFAULT_REGION", "us-east-1"),
              )
              for _ in range(40):
                  try:
                      s3.list_buckets()
                      break
                  except Exception as exc:
                      print("Esperando a MinIO...", exc, flush=True)
                      time.sleep(3)
              try:
                  s3.head_bucket(Bucket="mlflow")
                  print("Bucket mlflow ya existe.")
              except ClientError:
                  s3.create_bucket(Bucket="mlflow")
                  print("Bucket mlflow creado correctamente.")
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
