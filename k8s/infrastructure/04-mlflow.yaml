apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-pf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          # Comando de inicio del servidor MLflow con backend Postgres y artefactos en MinIO
          args:
            - |
              pip install --no-cache-dir mlflow==2.16.2 psycopg2-binary boto3 && \
              mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri $(MLFLOW_DB_URL) \
                --default-artifact-root s3://mlflow/
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: mlops-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-svc
  namespace: mlops-pf
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000