apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-pf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: joshin290/mlops-pf-mlflow:08d68eb39256cbe668d8cafc78daac21d3702c21
          command: ["sh", "-c"]
          args:
            - "mlflow server --host 0.0.0.0 --port 5000 --workers 2 --backend-store-uri ${MLFLOW_DB_URL} --default-artifact-root s3://mlflow/"
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: mlops-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 18
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-svc
  namespace: mlops-pf
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
