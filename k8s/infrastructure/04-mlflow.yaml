apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-pf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: joshin290/mlops-pf-mlflow:latest
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: mlops-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-svc
  namespace: mlops-pf
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000